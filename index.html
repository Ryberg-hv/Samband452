:root{
  --bg:#3C4F4F; --panel:#FFFFFF; --panel-2:#FAF9F5; --ink:#14181B; --ink-soft:#454B4F; --ink-faint:#6E7477;
  --line:#DBDBD6; --line-strong:#AFB0A9; --accent:#6B5416; --accent-ink:#FFFFFF; --accent-soft:#ECE3CE;
  --accent-bright:#D4AF37; --navy:#102442; --navy-ink:#FFFFFF; --warn:#95661E; --warn-soft:#F1E3CC;
  --danger:#8C3B32; --danger-soft:#F1DBD6; --ok:#2F6B3A; --radius:2px;
  --font-head:'S452 Stencil','Arial Narrow',Arial,Helvetica,sans-serif;
  --font-body:Arial,Helvetica,'Segoe UI',Roboto,sans-serif;
}
html.dark{
  --bg:#18201F; --panel:#20282A; --panel-2:#1A2123; --ink:#DCDFD8; --ink-soft:#B4B8B1; --ink-faint:#8D928C;
  --line:#34403F; --line-strong:#4D5A58; --accent:#8A6E1E; --accent-soft:#3A3322; --navy:#0A1628;
  --warn:#D9A54F; --warn-soft:#3A2F1C; --danger:#E08A7E; --danger-soft:#3A2220; --ok:#7BC48A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;min-height:100vh;-webkit-text-size-adjust:100%;}
h1,h2,h3{font-family:var(--font-head);font-weight:400;letter-spacing:.02em;margin:0;}
button,input,textarea{font-family:inherit;font-size:16px;color:inherit;}
button{cursor:pointer;}
.hidden{display:none !important;}

/* shield when app is in background (app switcher) */
#shield{position:fixed;inset:0;background:var(--navy);z-index:999;display:none;align-items:center;justify-content:center;}
body.shielded #shield{display:flex;}
#shield img{height:80px;opacity:.9;}

/* ---------- header ---------- */
.top{background:var(--navy);color:var(--navy-ink);position:relative;}
.top.big{padding:calc(18px + env(safe-area-inset-top)) 18px 6px;}
.top.big .row{display:flex;align-items:center;gap:14px;}
.top.big img.logo{height:64px;width:auto;flex-shrink:0;}
.top.big h1{font-size:clamp(26px,8.4vw,44px);line-height:1;text-transform:uppercase;white-space:nowrap;}
.top.big .meta{font-size:12px;letter-spacing:.08em;color:var(--accent-bright);font-weight:700;margin-top:4px;min-height:16px;}
.top .lockbtn{margin-left:auto;align-self:flex-start;}
.edge{position:relative;height:clamp(54px,17vw,110px);margin-bottom:-4px;}
.edge svg{display:block;width:100%;height:100%;}
.top.small{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:3px solid #fff;position:sticky;top:0;z-index:20;}
.top.small h2{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iconbtn{min-width:44px;height:44px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:#fff;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:14px;font-weight:700;}
.iconbtn svg{width:20px;height:20px;}

main{max-width:640px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom));}

/* ---------- generic ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.panel + .panel{margin-top:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--radius);font-weight:700;font-size:16px;}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.danger{color:var(--danger);border-color:var(--danger);}
.btn.block{display:flex;width:100%;}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px;}
.btn:disabled{opacity:.45;cursor:default;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}
.btnrow .btn{flex:1 1 auto;}
.stack{display:flex;flex-direction:column;gap:10px;}
.muted{color:var(--ink-faint);font-size:14px;}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.banner .txt{flex:1;font-size:15px;}
.banner.ok{border-color:var(--line-strong);background:var(--panel);}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex-shrink:0;}
.secthead{font-family:var(--font-head);color:#fff;font-size:18px;letter-spacing:.04em;margin:22px 2px 8px;text-transform:uppercase;}
html.dark .secthead{color:var(--ink);}

/* template menu */
.tpl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-height:72px;}
.tpl + .tpl{margin-top:8px;}
.tpl .nm{font-family:var(--font-head);font-size:28px;color:var(--accent);min-width:96px;}
html.dark .tpl .nm{color:var(--accent-bright);}
.tpl .nm.long{font-size:22px;}
.tpl .fl{font-size:13px;color:var(--ink-soft);flex:1;}
.tpl .chev{color:var(--ink-faint);}
.tpl .draft{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);padding:0 6px;margin-left:6px;vertical-align:middle;}

/* form */
.field{margin-bottom:14px;}
.field label,.flabel{display:block;font-family:var(--font-head);font-size:18px;color:var(--ink);margin-bottom:4px;letter-spacing:.02em;}
.group{border-left:3px solid var(--accent-soft);padding-left:12px;margin:4px 0 16px;}
.group > .gtitle{font-family:var(--font-head);font-size:20px;color:var(--accent);margin-bottom:8px;text-transform:uppercase;}
html.dark .group > .gtitle{color:var(--accent-bright);}
.group .field label{font-family:var(--font-body);font-weight:700;font-size:15px;}
textarea,input[type=text],input[type=tel],input[type=password],input[type=number]{width:100%;border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius);padding:10px 12px;line-height:1.4;}
textarea{resize:none;min-height:48px;overflow:hidden;display:block;}
textarea:focus,input:focus{outline:2px solid var(--accent-bright);outline-offset:0;border-color:var(--accent);}
::placeholder{color:var(--ink-faint);opacity:1;}
.inrow{display:flex;gap:8px;align-items:flex-start;}
.inrow > :first-child{flex:1;min-width:0;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chip{min-height:40px;padding:6px 12px;border:1px solid var(--line-strong);background:var(--panel-2);border-radius:20px;font-size:14px;font-weight:700;}
.scale{display:flex;gap:6px;}
.scale button{flex:1;min-height:52px;font-family:var(--font-head);font-size:24px;border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius);}
.scale button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.hint{font-size:13px;color:var(--ink-faint);margin-top:4px;}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 0 calc(8px + env(safe-area-inset-bottom));margin-top:8px;}

/* rendered message */
.msg{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.msg .mt{font-family:var(--font-head);font-size:28px;color:var(--accent);margin-bottom:8px;}
html.dark .msg .mt{color:var(--accent-bright);}
.msg .h{font-weight:700;margin-top:10px;}
.msg .h.g{font-family:var(--font-head);font-weight:400;font-size:18px;text-transform:uppercase;margin-top:14px;}
.msg .v{white-space:pre-wrap;word-wrap:break-word;}
.msg .empty{color:var(--ink-faint);}
.msg .sub b{font-weight:700;}
.listitem{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}
.listitem + .listitem{margin-top:8px;}
.listitem > button.lhead{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;min-height:56px;}
.listitem .lt{font-family:var(--font-head);font-size:20px;color:var(--accent);min-width:70px;}
html.dark .listitem .lt{color:var(--accent-bright);}
.listitem .ls{font-size:14px;color:var(--ink-soft);flex:1;}
.listitem .lbody{padding:0 14px 14px;}
.listitem .msg{border:0;padding:0;}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border:1px solid var(--line-strong);color:var(--ink-faint);}

/* lock screen */
#lock{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(30px + env(safe-area-inset-top)) 20px 30px;text-align:center;}
#lock img{height:96px;margin-bottom:10px;}
#lock h1{font-size:38px;text-transform:uppercase;}
#lock .lmsg{margin:18px 0 6px;font-size:17px;min-height:24px;}
#lock .lerr{color:#F3B3A9;font-size:15px;min-height:22px;}
.pindots{display:flex;gap:14px;justify-content:center;margin:10px 0 18px;}
.pindots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-bright);}
.pindots span.f{background:var(--accent-bright);}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center;}
.keypad button{height:66px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);color:#fff;font-size:28px;font-family:var(--font-head);}
.keypad button:active{background:rgba(255,255,255,.2);}
.keypad button.fn{font-family:var(--font-body);font-size:15px;font-weight:700;border-color:transparent;background:none;}
.keypad button:disabled{opacity:.35;}
.linkbtn{background:none;border:0;color:rgba(255,255,255,.7);text-decoration:underline;font-size:14px;margin-top:22px;min-height:44px;}

/* sheet / modal */
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
#sheet{background:var(--panel);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-top:4px solid var(--navy);padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
html.dark #sheet{border-top-color:var(--accent-bright);}
#sheet h3{font-size:24px;margin-bottom:10px;}
#sheet p{margin:0 0 12px;}
.dirs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.dirs button{min-height:46px;border:1px solid var(--line-strong);background:var(--panel);font-weight:700;border-radius:var(--radius);}
.dirs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.mgrsout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.02em;}
.cipher{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--panel-2);border:1px solid var(--line);padding:10px;max-height:140px;overflow:auto;}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;}
.switch{width:52px;height:30px;border-radius:15px;border:1px solid var(--line-strong);background:var(--panel-2);position:relative;flex-shrink:0;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-faint);transition:left .15s;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch.on::after{left:25px;background:#fff;}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:var(--radius);border:1px solid var(--accent-bright);z-index:80;max-width:90vw;font-size:15px;display:none;}
</style>

function b64(u8,padded=true){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); const r=btoa(s); return padded?r:r.replace(/=+$/,''); }
function unb64(s){ s=s.replace(/\s+/g,''); while(s.length%4) s+='='; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); }
function concat(...arrs){ const len=arrs.reduce((a,b)=>a+b.length,0); const o=new Uint8Array(len); let p=0; arrs.forEach(a=>{o.set(a,p);p+=a.length;}); return o; }

/* storage with in-memory fallback */
const mem = {};
let storageOK = true;
try{ localStorage.setItem('s452.t','1'); localStorage.removeItem('s452.t'); }catch(e){ storageOK=false; }
const store = {
  get(k){ try{ return storageOK?localStorage.getItem(k):(k in mem?mem[k]:null); }catch(e){ return mem[k]??null; } },
  set(k,v){ try{ if(storageOK) localStorage.setItem(k,v); else mem[k]=v; }catch(e){ mem[k]=v; } },
  del(k){ try{ if(storageOK) localStorage.removeItem(k); }catch(e){} delete mem[k]; }
};

/* ================= Crypto ================= */
const PIN_ITER = 600000, MSG_ITER = 150000;
async function deriveKey(secret, salt, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function aesEnc(key, data){ const iv=rnd(12); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data)); return concat(iv,ct); }
async function aesDec(key, blob){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:blob.subarray(0,12)},key,blob.subarray(12))); }
async function pipeBytes(u8, stream){ const r=new Blob([u8]).stream().pipeThrough(stream); return new Uint8Array(await new Response(r).arrayBuffer()); }
const canZip = typeof CompressionStream!=='undefined' && typeof DecompressionStream!=='undefined';

/* Message format: "S452:" + base64( ver(1) | flags(1) | salt(16) | iv(12) | ciphertext ) */
const MSG_PREFIX = 'S452:';
async function encryptMessage(obj, code){
  let data = enc.encode(JSON.stringify(obj)); let flags=0;
  if(canZip){ try{ const z=await pipeBytes(data,new CompressionStream('deflate-raw')); if(z.length<data.length){ data=z; flags|=1; } }catch(e){} }
  const salt=rnd(16); const key=await deriveKey(code,salt,MSG_ITER);
  const ivct=await aesEnc(key,data);
  return MSG_PREFIX + b64(concat(new Uint8Array([1,flags]),salt,ivct),false);
}
async function decryptMessage(text, codes){
  const m = text.match(/S452:([A-Za-z0-9+/=\s]+)/);
  if(!m) throw new Error('format');
  let raw; try{ raw=unb64(m[1]); }catch(e){ throw new Error('format'); }
  if(raw.length<31 || raw[0]!==1) throw new Error('format');
  const flags=raw[1], salt=raw.subarray(2,18), ivct=raw.subarray(18);
  for(const c of codes){
    try{
      const key=await deriveKey(c.c,salt,MSG_ITER);
      let data=await aesDec(key,ivct);
      if(flags&1) data=await pipeBytes(data,new DecompressionStream('deflate-raw'));
      return JSON.parse(dec.decode(data));
    }catch(e){}
  }
  throw new Error('key');
}

/* ================= Vault ================= */
let pinKey=null, vault=null, received=[], hiddenAt=0, saveTimer=null;
function emptyVault(){ return {user:{namn:'',komp:'',plut:'',grp:''}, codes:[], drafts:{}, saved:[], lastRemind:'', seenVersion:VERSION}; }
async function createVault(pin){
  const salt=rnd(16); store.set('s452.salt',b64(salt));
  pinKey=await deriveKey(pin,salt,PIN_ITER);
  vault=emptyVault(); await saveVault();
}
async function openVault(pin){
  const salt=unb64(store.get('s452.salt'));
  const key=await deriveKey(pin,salt,PIN_ITER);
  const blob=unb64(store.get('s452.vault'));
  const data=await aesDec(key,blob); // throws on wrong PIN
  pinKey=key; vault=Object.assign(emptyVault(),JSON.parse(dec.decode(data)));
}
async function saveVault(){
  if(!pinKey||!vault) return;
  const blob=await aesEnc(pinKey,enc.encode(JSON.stringify(vault)));
  store.set('s452.vault',b64(blob));
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveVault,400); }
function hasVault(){ return !!(store.get('s452.vault')&&store.get('s452.salt')); }

/* day codes: today's kept; yesterday's kept until 06:00 */
function pruneDrafts(){
  if(!vault) return; const now=Date.now(); let ch=false;
  Object.keys(vault.drafts).forEach(id=>{ const d=vault.drafts[id]; if(d&&d._t&&now-d._t>DRAFT_MAX_MS){ delete vault.drafts[id]; ch=true; } });
  if(ch) saveSoon();
}
function pruneCodes(){
  if(!vault) return;
  const now=new Date(), today=dayKey(now);
  const y=new Date(now); y.setDate(y.getDate()-1); const yest=dayKey(y);
  const before=vault.codes.length;
  vault.codes=vault.codes.filter(c=>c.d===today || (c.d===yest && now.getHours()<6));
  if(vault.codes.length!==before) saveSoon();
}
function todaysCode(){ pruneCodes(); const t=dayKey(); const list=vault.codes.filter(c=>c.d===t); return list.length?list[list.length-1]:null; }
function codesNewestFirst(){ pruneCodes(); return vault.codes.slice().reverse(); }

/* ================= MGRS (WGS84) ================= */
const MGRS = (()=>{
  const a=6378137, f=1/298.257223563, k0=0.9996, e2=f*(2-f), ep2=e2/(1-e2);
  const R=Math.PI/180, BANDS='CDEFGHJKLMNPQRSTUVWX';
  function zoneOf(lat,lon){
    let z=Math.floor((lon+180)/6)+1;
    if(lat>=56&&lat<64&&lon>=3&&lon<12) z=32;
    if(lat>=72&&lat<84){ if(lon>=0&&lon<9) z=31; else if(lon>=9&&lon<21) z=33; else if(lon>=21&&lon<33) z=35; else if(lon>=33&&lon<42) z=37; }
    return z;
  }
  function M(phi){ return a*((1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)*phi-(3*e2/8+3*e2*e2/32+45*e2*e2*e2/1024)*Math.sin(2*phi)+(15*e2*e2/256+45*e2*e2*e2/1024)*Math.sin(4*phi)-(35*e2*e2*e2/3072)*Math.sin(6*phi)); }
  function toUTM(lat,lon,zone){
    zone=zone||zoneOf(lat,lon);
    const phi=lat*R, lam0=((zone-1)*6-180+3)*R;
    const N=a/Math.sqrt(1-e2*Math.sin(phi)**2), T=Math.tan(phi)**2, C=ep2*Math.cos(phi)**2, A=Math.cos(phi)*(lon*R-lam0);
    const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
    let Nn=k0*(M(phi)+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
    if(lat<0) Nn+=10000000;
    return {zone,E,N:Nn,south:lat<0};
  }
  function fromUTM(zone,E,Nn,south){
    const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
    const mu=(south?Nn-10000000:Nn)/k0/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256));
    const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
    const C1=ep2*Math.cos(p1)**2, T1=Math.tan(p1)**2, N1=a/Math.sqrt(1-e2*Math.sin(p1)**2), R1=a*(1-e2)/Math.pow(1-e2*Math.sin(p1)**2,1.5), D=(E-500000)/(N1*k0);
    const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
    const lon=((zone-1)*6-180+3)*R+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
    return {lat:lat/R, lon:lon/R};
  }
  function band(lat){ let i=Math.floor((lat+80)/8); if(i>19) i=19; if(i<0) i=0; return BANDS[i]; }
  function fromLatLon(lat,lon,digits=4){
    if(lat<-80||lat>84) return null;
    const u=toUTM(lat,lon);
    const set=((u.zone-1)%6)+1;
    const cols=['ABCDEFGH','JKLMNPQR','STUVWXYZ'][(set-1)%3];
    const rows='ABCDEFGHJKLMNPQRSTUV';
    const col=cols[Math.floor(u.E/100000)-1];
    const rowIdx=(Math.floor(u.N/100000)+(set%2===0?5:0))%20;
    const row=rows[rowIdx];
    const div=Math.pow(10,5-digits);
    const e=pad(Math.floor((u.E%100000)/div),digits), n=pad(Math.floor((u.N%100000)/div),digits);
    return u.zone+band(lat)+' '+col+row+' '+e+' '+n;
  }
  /* point at distance d (m) and grid bearing (mils, 6400) from lat/lon, computed in the grid */
  function offset(lat,lon,d,mils){
    const u=toUTM(lat,lon), th=mils/6400*2*Math.PI;
    return fromUTM(u.zone,u.E+d*Math.sin(th),u.N+d*Math.cos(th),u.south);
  }
  return {fromLatLon,offset,toUTM,fromUTM};
})();

/* ================= Rendering messages ================= */
function buildPayload(t){
  const d=vault.drafts[t.id]||{}; const f={};
  flatFields(t).forEach(x=>{ const v=(d[x.k]||'').trim(); if(v) f[x.k]=v; });
  const now=dtg();
  const o=(d._ov||'').trim(); if(o) f._ov=o;
  if(t.ownSagesman) f.sag=withDtg((d.sag??userString()).trim(), now);
  else f._sm=withDtg(userString(), now);
  return {v:1,t:t.id,f};
}
function renderMessage(p){
  const t=tplById(p.t); const f=p.f||{};
  let h='<div class="mt">'+esc(t?t.name:p.t)+'</div>';
  const val=v=> v ? '<div class="v">'+esc(v)+'</div>' : '<div class="v empty">–</div>';
  if(t){
    t.fields.forEach(x=>{
      if(x.g){
        h+='<div class="h g">'+esc(x.g)+'</div>';
        x.items.forEach(i=>{ h+='<div class="v sub"><b>'+esc(i.l)+':</b> '+(f[i.k]?esc(f[i.k]):'<span class="empty">–</span>')+'</div>'; });
      } else if(t.freeText){
        h+=val(f[x.k]);
      } else {
        h+='<div class="h">'+esc(x.l)+'</div>'+val(f[x.k]);
      }
    });
  } else {
    Object.keys(f).filter(k=>k[0]!=='_').forEach(k=>{ h+='<div class="h">'+esc(k)+'</div>'+val(f[k]); });
  }
  if(f._ov) h+='<div class="h">Övrigt</div>'+val(f._ov);
  if(f._sm) h+='<div class="h">Sagesman</div>'+val(f._sm);
  return h;
}
function plainMessage(p){
  const t=tplById(p.t); const f=p.f||{}; const L=[t?t.name:p.t];
  const v=x=>x||'–';
  if(t) t.fields.forEach(x=>{
    if(x.g){ L.push('',x.g.toUpperCase()); x.items.forEach(i=>L.push(i.l+': '+v(f[i.k]))); }
    else if(t.freeText){ L.push(v(f[x.k])); }
    else { L.push('',x.l,v(f[x.k])); }
  });
  if(f._ov) L.push('','Övrigt',f._ov);
  if(f._sm) L.push('','Sagesman',f._sm);
  return L.join('\n');
}
function msgSummary(p){
  const s=(p.f&&(p.f._sm||p.f.sag))||''; return s;
}

let pinBuf='', pinMode='unlock', pinFirst='', pinBusy=false;
function failState(){ try{ return JSON.parse(store.get('s452.fail')||'{"n":0,"until":0}'); }catch(e){ return {n:0,until:0}; } }
function renderLock(msg){
  if(!hasVault() && pinMode==='unlock') pinMode='setup1';
  const title={unlock:'Ange PIN-kod',setup1:'Välj en PIN-kod (6 siffror)',setup2:'Bekräfta PIN-koden',change1:'Ny PIN-kod (6 siffror)',change2:'Bekräfta ny PIN-kod'}[pinMode];
  app.innerHTML='<div id="lock"><img src="'+LOGO+'" alt=""><h1>Samband 452</h1>'+
    '<div class="lmsg">'+title+'</div><div class="pindots">'+[0,1,2,3,4,5].map(i=>'<span class="'+(i<pinBuf.length?'f':'')+'"></span>').join('')+'</div>'+
    '<div class="lerr" id="lerr">'+esc(msg||'')+'</div>'+
    '<div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+
    (pinMode.startsWith('change')?'<button class="fn" data-k="x">Avbryt</button>':'<span></span>')+'<button data-k="0">0</button><button class="fn" data-k="b" aria-label="Radera">⌫</button></div>'+
    (pinMode==='unlock'?'<button class="linkbtn" id="forgot">Glömt PIN-koden?</button>':'')+
    (pinMode==='setup1'?'<p style="max-width:360px;font-size:14px;color:rgba(255,255,255,.75);margin-top:22px">PIN-koden skyddar allt som sparas i appen. Den kan inte återställas – glömmer du den måste appen nollställas. Efter '+MAX_FAILS+' felaktiga försök raderas appen.</p>':'')+
    (!storageOK?'<p style="font-size:13px;color:#F3B3A9">Lagring är inte tillgänglig i den här webbläsaren. Inget sparas när sidan stängs.</p>':'')+
    '</div>';
  app.querySelectorAll('.keypad [data-k]').forEach(b=>b.onclick=()=>pinKey_(b.dataset.k));
  const fg=$('#forgot'); if(fg) fg.onclick=()=>confirmSheet('Nollställ appen?','Allt raderas: dygnskoder, utkast, sparade meddelanden, användarinfo och PIN-kod.','Nollställ',()=>{ resetApp(); });
  tickLockout();
}
function tickLockout(){
  if(pinMode!=='unlock') return;
  const fs=failState(); const left=Math.ceil((fs.until-Date.now())/1000);
  const keys=app.querySelectorAll('.keypad button');
  if(left>0){ keys.forEach(k=>k.disabled=true); const el=$('#lerr'); if(el) el.textContent='För många felförsök. Vänta '+left+' s. '+(MAX_FAILS-fs.n)+' försök kvar innan appen raderas.'; clearTimeout(tickLockout._t); tickLockout._t=setTimeout(tickLockout,1000); }
  else keys.forEach(k=>k.disabled=false);
}
async function pinKey_(k){
  if(pinBusy) return;
  if(k==='x'){ pinMode='unlock'; pinBuf=''; go('settings'); return; }
  if(k==='b'){ pinBuf=pinBuf.slice(0,-1); renderLockKeep(); return; }
  if(pinBuf.length>=6) return;
  pinBuf+=k; renderLockKeep();
  if(pinBuf.length<6) return;
  const p=pinBuf; pinBuf='';
  if(pinMode==='setup1'||pinMode==='change1'){ pinFirst=p; pinMode=pinMode==='setup1'?'setup2':'change2'; renderLockKeep(); return; }
  if(pinMode==='setup2'||pinMode==='change2'){
    if(p!==pinFirst){ pinMode=pinMode==='setup2'?'setup1':'change1'; renderLock('PIN-koderna matchade inte. Försök igen.'); return; }
    pinBusy=true; renderLock('Skapar…');
    if(pinMode==='setup2'){ await createVault(p); pinBusy=false; pinMode='unlock'; afterUnlock(true); }
    else { const keep=vault; await createVault(p); vault=keep; await saveVault(); pinBusy=false; pinMode='unlock'; toast('PIN-koden är bytt'); go('settings'); }
    return;
  }
  // unlock
  pinBusy=true; renderLock('Låser upp…');
  try{ await openVault(p); store.set('s452.fail','{"n":0,"until":0}'); pinBusy=false; afterUnlock(false); }
  catch(e){
    pinBusy=false;
    const fs=failState(); fs.n++;
    if(fs.n>=MAX_FAILS){ resetApp('Appen raderades efter '+MAX_FAILS+' felaktiga PIN-försök.'); return; }
    if(fs.n>=5) fs.until=Date.now()+Math.min(300,30*Math.pow(2,fs.n-5))*1000;
    store.set('s452.fail',JSON.stringify(fs));
    const left=MAX_FAILS-fs.n;
    renderLock('Fel PIN-kod.'+(fs.n>=3?' '+left+' försök kvar innan appen raderas.':''));
  }
}
function renderLockKeep(){ const err=$('#lerr')?$('#lerr').textContent:''; renderLock(pinBuf.length?'':err); }
function afterUnlock(isNew){
  pruneCodes(); pruneDrafts();
  if(isNew){ go('user'); return; }
  go('home');
  if(vault.seenVersion!==VERSION){
    const items=CHANGELOG.filter(c=>c.v===VERSION).flatMap(c=>c.items);
    vault.seenVersion=VERSION; saveSoon();
    openSheet('<h3>Nytt i version '+esc(VERSION)+'</h3><ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul><button class="btn primary block" id="ok">OK</button>',s=>$('#ok',s).onclick=()=>{ closeSheet(); remindSaved(); });
  } else remindSaved();
}
function remindSaved(){
  const t=dayKey();
  if(vault.saved.length && vault.lastRemind!==t){
    vault.lastRemind=t; saveSoon();
    const n=vault.saved.length;
    openSheet('<h3>Sparade meddelanden</h3><p>Du har '+n+' sparade meddelande'+(n===1?'':'n')+'. Radera?</p><div class="btnrow"><button class="btn danger" id="del">Radera alla</button><button class="btn" id="keep">Behåll</button></div>',s=>{
      $('#del',s).onclick=()=>{ vault.saved=[]; saveVault(); closeSheet(); render(); toast('Sparade meddelanden raderade'); };
      $('#keep',s).onclick=closeSheet;
    });
  }
}

/* ================= Send ================= */
function smsParts(n){ return n<=160?1:Math.ceil(n/153); }
async function sendFlow(t){
  const code=todaysCode();
  if(!code){ confirmSheet('Dygnskod saknas','Ange dagens kod innan du skickar.','Ange kod',()=>go('code')); return; }
  const payload=buildPayload(t);
  const cipher=await encryptMessage(payload,code.c);
  const parts=smsParts(cipher.length);
  const canShare=!!navigator.share;
  openSheet('<h3>Krypterat '+esc(t.name)+'</h3>'+
    '<p class="muted">'+cipher.length+' tecken · ca '+parts+' SMS</p>'+
    (parts>3?'<div class="banner"><div class="txt">Långt för SMS. Slack eller mejl är bättre.</div></div>':'')+
    '<div class="cipher">'+esc(cipher)+'</div>'+
    '<div class="stack" style="margin-top:12px">'+
      (canShare?'<button class="btn primary block" id="share" style="min-height:56px;font-size:17px">Dela (SMS, Slack, mejl…)</button>':'<button class="btn primary block" id="copy">Kopiera</button><p class="muted" style="margin:0">Delning stöds inte i den här webbläsaren.</p>')+
      '<button class="btn block" id="done">Klar – töm formuläret</button>'+
      '<button class="btn block" id="cancel">Stäng</button>'+
    '</div>',s=>{
      const sh=$('#share',s); if(sh) sh.onclick=async()=>{ try{ await navigator.share({text:cipher}); }catch(e){} };
      const cp=$('#copy',s); if(cp) cp.onclick=()=>copyText(cipher);
      $('#done',s).onclick=()=>{ vault.drafts[t.id]={}; saveVault(); closeSheet(); go('home'); toast(t.name+' tömt'); };
      $('#cancel',s).onclick=closeSheet;
    });
}
function sendPlain(t){
  const txt=plainMessage(buildPayload(t));
  const canShare=!!navigator.share;
  openSheet('<h3>'+esc(t.name)+' i klartext</h3>'+
    '<div class="banner" style="border-color:var(--danger);background:var(--danger-soft)"><div class="txt"><b>OKRYPTERAT.</b> Kan läsas av alla som ser meddelandet eller telefonen.</div></div>'+
    '<div class="cipher" style="font-family:var(--font-body);font-size:14px;white-space:pre-wrap;word-break:normal;max-height:200px">'+esc(txt)+'</div>'+
    '<div class="stack" style="margin-top:12px">'+
      (canShare?'<button class="btn primary block" id="share" style="min-height:56px;font-size:17px">Dela (SMS, Slack, mejl…)</button>':'<button class="btn primary block" id="copy">Kopiera</button><p class="muted" style="margin:0">Delning stöds inte i den här webbläsaren.</p>')+
      '<button class="btn block" id="done">Klar – töm formuläret</button>'+
      '<button class="btn block" id="cancel">Stäng</button>'+
    '</div>',s=>{
      const sh=$('#share',s); if(sh) sh.onclick=async()=>{ try{ await navigator.share({text:txt}); }catch(e){} };
      const cp=$('#copy',s); if(cp) cp.onclick=()=>copyText(txt);
      $('#done',s).onclick=()=>{ vault.drafts[t.id]={}; saveVault(); closeSheet(); go('home'); toast(t.name+' tömt'); };
      $('#cancel',s).onclick=closeSheet;
    });
}
async function copyText(txt){
  let ok=false;
  try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand('copy'); }catch(e2){} ta.remove();
  }
  if(!ok){ toast('Kunde inte kopiera – markera texten och kopiera manuellt'); return; }
  toast('Kopierat. Utklippet töms om 60 s.');
  clearTimeout(copyText._t);
  copyText._t=setTimeout(async()=>{ try{ const cur=await navigator.clipboard.readText().catch(()=>null); if(cur===null||cur===txt) await navigator.clipboard.writeText(' '); }catch(e){} },CLIP_CLEAR_MS);
}

/* ================= Position ================= */
const DIRS=[['N',0],['NO',800],['O',1600],['SO',2400],['S',3200],['SV',4000],['V',4800],['NV',5600]];
function positionSheet(onInsert){
  let fix=null, dir=null, dirLabel='';
  openSheet('<h3>Min position</h3>'+
    '<div id="pstat" class="muted">Hämtar position…</div><div id="pown" class="mgrsout" style="margin:4px 0 14px"></div>'+
    '<div class="field"><label for="pdist">Avstånd till mål (m)</label><input type="number" id="pdist" inputmode="numeric" min="0" max="50000" placeholder="Lämna tomt för egen position"></div>'+
    '<span class="flabel">Riktning</span><div class="dirs">'+DIRS.map(([n,m])=>'<button type="button" data-m="'+m+'" data-n="'+n+'">'+n+'</button>').join('')+'</div>'+
    '<div class="field" style="margin-top:8px"><label for="pmils" style="font-family:var(--font-body);font-size:15px;font-weight:700">eller mils (0–6399)</label><input type="number" id="pmils" inputmode="numeric" min="0" max="6399"></div>'+
    '<div class="hint" style="margin-top:-8px;margin-bottom:12px">Riktning mot rutnätsnord.</div>'+
    '<div class="panel" style="background:var(--panel-2)"><div class="muted">Infogas:</div><div id="pres" style="font-weight:700">–</div></div>'+
    '<div class="btnrow" style="margin-top:12px"><button class="btn primary" id="pins" disabled>Infoga</button><button class="btn" id="pretry">Hämta igen</button><button class="btn" id="pcan">Avbryt</button></div>',
  s=>{
    const dist=$('#pdist',s), mils=$('#pmils',s), res=$('#pres',s), ins=$('#pins',s);
    function result(){
      if(!fix) return null;
      const d=parseFloat(dist.value);
      if(!(d>0)) return MGRS.fromLatLon(fix.lat,fix.lon);
      if(dir===null) return null;
      const p=MGRS.offset(fix.lat,fix.lon,d,dir);
      return MGRS.fromLatLon(p.lat,p.lon)+' (ca '+Math.round(d)+' m '+(dirLabel.startsWith('mils')?'i '+dir+' mils från':dirLabel+' om')+' egen pos)';
    }
    function upd(){
      const r=result(); res.textContent = r || (fix ? 'Välj riktning' : '–'); ins.disabled=!r;
    }
    s.querySelectorAll('.dirs button').forEach(b=>b.onclick=()=>{ dir=+b.dataset.m; dirLabel=b.dataset.n; mils.value=''; s.querySelectorAll('.dirs button').forEach(o=>o.classList.toggle('on',o===b)); upd(); });
    mils.oninput=()=>{ const m=parseInt(mils.value,10); s.querySelectorAll('.dirs button').forEach(o=>o.classList.remove('on')); if(m>=0&&m<6400){ dir=m; dirLabel='mils'; } else { dir=null; } upd(); };
    dist.oninput=upd;
    ins.onclick=()=>{ const r=result(); if(r){ closeSheet(); onInsert(r); } };
    $('#pcan',s).onclick=closeSheet;
    function get(){
      const st=$('#pstat',s);
      if(!navigator.geolocation){ st.textContent='Telefonen ger ingen position i den här webbläsaren.'; return; }
      st.textContent='Hämtar position…';
      navigator.geolocation.getCurrentPosition(p=>{
        fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
        st.textContent='Egen position (±'+Math.round(fix.acc)+' m):';
        $('#pown',s).textContent=MGRS.fromLatLon(fix.lat,fix.lon)||'Utanför MGRS-området';
        upd();
      },err=>{
        st.textContent = err.code===1 ? 'Positionen nekades. Tillåt plats för appen i telefonens inställningar.' : err.code===3 ? 'Ingen GPS-fix ännu. Gå utomhus och försök igen.' : 'Kunde inte hämta position.';
      },{enableHighAccuracy:true,timeout:30000,maximumAge:0});
    }
    $('#pretry',s).onclick=get;
    get();
  });
}

/* ================= Inbox ================= */
function renderInbox(){
  const item=(p,i,kind)=>'<div class="listitem"><button class="lhead" data-open="'+kind+i+'" aria-expanded="false"><span class="lt">'+esc(p.t)+'</span><span class="ls">'+esc(msgSummary(p))+'</span>'+(kind==='r'?'<span class="tag">EJ SPARAT</span>':'')+'</button>'+
    '<div class="lbody hidden" id="b_'+kind+i+'"><div class="msg">'+renderMessage(p)+'</div><div class="btnrow" style="margin-top:12px">'+
    '<button class="btn primary" data-ack="'+kind+i+'">Kvittera</button>'+(kind==='r'?'<button class="btn" data-save="'+i+'">Spara</button>':'')+'<button class="btn danger" data-del="'+kind+i+'">Radera</button></div></div></div>';
  app.innerHTML=headerSmall('Mottaget')+'<main>'+
    '<div class="panel"><label class="flabel" for="incoming">Klistra in meddelande</label>'+
    '<textarea id="incoming" rows="3" '+TA_ATTR+' placeholder="S452:…"></textarea>'+
    '<div class="btnrow" style="margin-top:10px">'+(navigator.clipboard&&navigator.clipboard.readText?'<button class="btn" id="paste">Klistra in</button>':'')+'<button class="btn primary" id="decrypt">Läs</button></div></div>'+
    (received.length?'<div class="secthead">Mottagna nu</div><div class="muted" style="color:#E6E9E3;margin:-4px 2px 8px">Töms när appen låses, om du inte sparar dem.</div>'+received.map((p,i)=>item(p,i,'r')).reverse().join(''):'')+
    (vault.saved.length?'<div class="secthead">Sparade</div>'+vault.saved.map((s,i)=>item(s.p,i,'s')).reverse().join(''):'')+
  '</main>';
  const inc=$('#incoming'); autosize(inc); inc.oninput=()=>autosize(inc);
  const ps=$('#paste'); if(ps) ps.onclick=async()=>{ try{ inc.value=await navigator.clipboard.readText(); autosize(inc); }catch(e){ toast('Klistra in manuellt i rutan'); } };
  $('#decrypt').onclick=async()=>{
    const txt=inc.value.trim(); if(!txt){ toast('Klistra in ett meddelande först'); return; }
    if(!vault.codes.length){ confirmSheet('Dygnskod saknas','Ange dagens kod för att kunna läsa meddelanden.','Ange kod',()=>go('code')); return; }
    try{ const p=await decryptMessage(txt,codesNewestFirst()); received.push(p); renderInbox(); const ib=$('#b_r'+(received.length-1)); if(ib){ ib.classList.remove('hidden'); ib.previousElementSibling.setAttribute('aria-expanded','true'); } }
    catch(e){ toast(e.message==='format'?'Hittar inget Samband 452-meddelande i texten':'Kunde inte läsa. Fel eller saknad dygnskod.',3500); }
  };
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ const body=$('#b_'+b.dataset.open); const open=body.classList.toggle('hidden'); b.setAttribute('aria-expanded',!open); });
  app.querySelectorAll('[data-ack]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ack, i=+k.slice(1); ackFlow(k[0]==='r'?received[i]:vault.saved[i].p); });
  app.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.save; vault.saved.push({at:Date.now(),p:received[i]}); received.splice(i,1); saveVault(); renderInbox(); toast('Sparat. Påminnelse om radering varje dygn.'); });
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const k=b.dataset.del, i=+k.slice(1); if(k[0]==='r') received.splice(i,1); else { vault.saved.splice(i,1); saveVault(); } renderInbox(); });
}

function receiptText(p){
  const src=(p.f&&(p.f._sm||p.f.sag))||''; const parts=src.split(' / '); const ref=parts[parts.length-1]||'';
  return 'KVITTO '+p.t+(/^\d{6}$/.test(ref)?' '+ref:'')+' – '+withDtg(userString(),dtg());
}
function ackFlow(p){
  const txt=receiptText(p);
  if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); return; }
  openSheet('<h3>Kvittens</h3><div class="cipher" style="font-family:var(--font-body);font-size:15px">'+esc(txt)+'</div><div class="stack" style="margin-top:12px"><button class="btn primary block" id="copy">Kopiera</button><button class="btn block" id="cancel">Stäng</button></div>',s=>{
    $('#copy',s).onclick=()=>{ copyText(txt); closeSheet(); }; $('#cancel',s).onclick=closeSheet;
  });
}

/* ================= Day code ================= */
function renderCode(){
  const c=todaysCode();
  app.innerHTML=headerSmall('Dygnskod')+'<main><div class="panel stack">'+
    '<div>'+(c?'<b>Kod inmatad för '+esc(prettyDay(c.d))+'.</b>':'<b>Ingen kod för idag.</b>')+'</div>'+
    '<label class="flabel" for="code">'+(c?'Byt dagens kod':'Dagens kod')+'</label>'+
    '<div class="inrow"><input type="password" id="code" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off"><button class="btn" id="show" type="button">Visa</button></div>'+
    '<button class="btn primary block" id="savecode">Spara</button>'+
    '<p class="muted" style="margin:0">Koden gäller till midnatt. Gårdagens kod sparas till kl. 06 så att meddelanden skickade före midnatt går att läsa, sedan raderas den. Distribuera aldrig koden i samma kanal som meddelandena.</p>'+
  '</div></main>';
  $('#show').onclick=()=>{ const i=$('#code'); i.type=i.type==='password'?'text':'password'; $('#show').textContent=i.type==='password'?'Visa':'Dölj'; };
  $('#savecode').onclick=()=>{ const v=$('#code').value.trim(); if(!v){ toast('Skriv in koden'); return; } vault.codes.push({d:dayKey(),c:v,t:Date.now()}); vault.codes=vault.codes.slice(-4); saveVault(); toast('Dygnskoden sparad'); go('home'); };
}

/* ================= User info ================= */
function renderUser(){
  const u=vault.user;
  const inp=(k,l,max)=>'<div class="field"><label for="u_'+k+'">'+l+'</label><input type="text" id="u_'+k+'" data-k="'+k+'" maxlength="'+max+'" value="'+esc(u[k]||'')+'" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" style="text-transform:uppercase"></div>';
  app.innerHTML=headerSmall('Användarinfo')+'<main><div class="panel">'+
    '<p class="muted" style="margin-top:0">Läggs till som Sagesman sist i varje meddelande. Inget fält är obligatoriskt.</p>'+
    inp('namn','Namn',10)+'<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">'+inp('komp','Kompani',3)+inp('plut','Pluton',2)+inp('grp','Grupp',2)+'</div>'+
    '<div class="muted">Visas som: <b id="uprev">'+esc(withDtg(userString(),dtg()))+'</b></div>'+
    '<button class="btn primary block" data-act="home" style="margin-top:14px">Klar</button></div></main>';
  app.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{
    const pos=i.selectionStart; i.value=i.value.toUpperCase(); try{ i.setSelectionRange(pos,pos); }catch(e){}
    u[i.dataset.k]=i.value.trim(); saveSoon(); $('#uprev').textContent=withDtg(userString(),dtg());
  });
}

/* ================= Settings ================= */
function isDark(){ return document.documentElement.classList.contains('dark'); }
function renderSettings(){
  app.innerHTML=headerSmall('Inställningar')+'<main>'+
    '<div class="panel stack">'+
      '<button class="btn block" data-act="user">Användarinfo</button>'+
      '<button class="btn block" data-act="code">Dygnskod</button>'+
      '<div class="toggle"><span><b>Mörkt läge</b><br><span class="muted">För fält och mörker</span></span><button class="switch'+(isDark()?' on':'')+'" id="dark" role="switch" aria-checked="'+isDark()+'" aria-label="Mörkt läge"></button></div>'+
      '<button class="btn block" id="chpin">Byt PIN-kod</button>'+
    '</div>'+
    '<div class="panel stack">'+
      '<button class="btn danger block" id="wipe">Rensa allt</button>'+
      '<p class="muted" style="margin:0">Raderar dygnskoder, utkast och alla mottagna och sparade meddelanden. Användarinfo och PIN-kod behålls.</p>'+
      '<button class="btn danger block" id="reset" style="margin-top:6px">Nollställ appen</button>'+
      '<p class="muted" style="margin:0">Raderar allt, även PIN-kod och användarinfo.</p>'+
    '</div>'+
    '<p style="color:#E6E9E3;font-size:13px;text-align:center;margin-top:18px">Samband 452 · version '+esc(VERSION)+'<br>Skydd för övnings- och ej klassificerad information.</p>'+
  '</main>';
  $('#dark').onclick=()=>{ const on=!isDark(); document.documentElement.classList.toggle('dark',on); store.set('s452.theme',on?'dark':'light'); renderSettings(); };
  $('#chpin').onclick=()=>{ pinMode='change1'; pinBuf=''; renderLock(); };
  $('#wipe').onclick=()=>confirmSheet('Rensa allt?','Dygnskoder, utkast och alla mottagna och sparade meddelanden raderas.','Rensa',()=>{ vault.codes=[]; vault.drafts={}; vault.saved=[]; received=[]; saveVault(); go('home'); toast('Allt rensat'); });
  $('#reset').onclick=()=>confirmSheet('Nollställ appen?','Allt raderas, även PIN-kod och användarinfo.','Nollställ',()=>resetApp());
}

/* ================= Sheet helpers ================= */
function openSheet(html,bind){ const w=$('#sheetWrap'), s=$('#sheet'); s.innerHTML=html; w.classList.remove('hidden'); s.scrollTop=0; if(bind) bind(s); }
function closeSheet(){ $('#sheetWrap').classList.add('hidden'); $('#sheet').innerHTML=''; }
$('#sheetWrap').addEventListener('click',e=>{ if(e.target.id==='sheetWrap') closeSheet(); });
function confirmSheet(title,text,okLabel,onOk){
  openSheet('<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="btnrow"><button class="btn danger" id="cok">'+esc(okLabel)+'</button><button class="btn" id="ccan">Avbryt</button></div>',s=>{
    $('#cok',s).onclick=()=>{ closeSheet(); onOk(); }; $('#ccan',s).onclick=closeSheet;
  });
}

/* ================= Start ================= */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(store.get('s452.theme')==='dark') document.documentElement.classList.add('dark');
if(!window.crypto||!crypto.subtle){
  app.innerHTML='<div id="lock"><img src="'+LOGO+'" alt=""><h1>Samband 452</h1><p class="lmsg">Krypteringen kräver att sidan öppnas via https eller som lokal fil i en modern webbläsare.</p></div>';
} else render();
</script>
